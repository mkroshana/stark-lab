# ==============================================
# Jellyfin Dynamic Configuration
# Location: /etc/traefik/conf.d/jellyfin.yaml
#
# Shared middlewares are in _shared.yaml
# ==============================================

http:
  routers:
    # -- Main Jellyfin Router --
    jellyfin:
      rule: "Host(`jellyfin.starklab.mkroshana.com`)"
      entryPoints:
        - websecure
      service: jellyfin-svc
      middlewares:
        - crowdsec-bouncer
        - security-headers
        - jellyfin-rate-limit
      tls:
        certResolver: cloudflare

    # -- Block Swagger / API Docs --
    jellyfin-block-swagger:
      rule: "Host(`jellyfin.starklab.mkroshana.com`) && PathPrefix(`/api-docs`)"
      entryPoints:
        - websecure
      service: jellyfin-svc
      middlewares:
        - block-external
      tls:
        certResolver: cloudflare
      priority: 100

    # -- Strict rate limit on auth endpoint --
    jellyfin-auth:
      rule: "Host(`jellyfin.starklab.mkroshana.com`) && PathPrefix(`/Users/AuthenticateByName`)"
      entryPoints:
        - websecure
      service: jellyfin-svc
      middlewares:
        - crowdsec-bouncer
        - security-headers
        - auth-rate-limit
      tls:
        certResolver: cloudflare
      priority: 50

    # -- Theme stylesheet: browsers must revalidate (ETag) on every load --
    # The NeutralFin theme ships as /web/themes/dark/theme.css with no version
    # string, so without this browsers keep a stale copy after a deploy.
    # Longer rule than the main router, so it wins by default priority.
    jellyfin-theme:
      rule: "Host(`jellyfin.starklab.mkroshana.com`) && PathPrefix(`/web/themes/`)"
      entryPoints:
        - websecure
      service: jellyfin-svc
      middlewares:
        - crowdsec-bouncer
        - security-headers
        - jellyfin-rate-limit
        - jellyfin-theme-revalidate
      tls:
        certResolver: cloudflare

  middlewares:
    # Also used by local-jellyfin.yaml. Defined here, not in _shared.yaml,
    # because this file holds no secrets and can be copied to CT 100 as is.
    jellyfin-theme-revalidate:
      headers:
        customResponseHeaders:
          Cache-Control: "no-cache"

  services:
    jellyfin-svc:
      loadBalancer:
        servers:
          - url: "http://10.10.10.121:8096"
        passHostHeader: true
