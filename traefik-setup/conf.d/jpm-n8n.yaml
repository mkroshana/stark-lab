# ==============================================
# JobProMax n8n Dynamic Configuration (CT 210)
# Location: /etc/traefik/conf.d/jpm-n8n.yaml
#
# Shared middlewares are in _shared.yaml
# Default port: 5678
# ==============================================

http:
  routers:
    # -- Main JobProMax n8n Router --
    jpm-n8n:
      rule: "Host(`n8n.jobpromax.it.com`)"
      entryPoints:
        - websecure
      service: jpm-n8n-svc
      middlewares:
        - crowdsec-bouncer
        - security-headers-iframe
        - general-rate-limit
      tls:
        certResolver: letsencrypt-http

    # -- Strict rate limit on n8n login endpoint --
    jpm-n8n-auth:
      rule: "Host(`n8n.jobpromax.it.com`) && PathPrefix(`/rest/login`)"
      entryPoints:
        - websecure
      service: jpm-n8n-svc
      middlewares:
        - crowdsec-bouncer
        - security-headers-iframe
        - auth-rate-limit
      tls:
        certResolver: letsencrypt-http
      priority: 50

  services:
    jpm-n8n-svc:
      loadBalancer:
        servers:
          - url: "http://10.10.10.210:5678"
        passHostHeader: true
