# ==============================================
# Local ArcReach Dynamic Configuration (CT 211)
# Location: /etc/traefik/conf.d/local-arcreach.yaml
# ==============================================

http:
  routers:
    local-arcreach:
      rule: "Host(`jpm-mail.local.starklab.mkroshana.com`) || Host(`arcreach.local.starklab.mkroshana.com`)"
      entryPoints:
        - websecure
      service: local-arcreach-svc
      middlewares:
        - local-only
      tls:
        certResolver: cloudflare

  services:
    local-arcreach-svc:
      loadBalancer:
        servers:
          - url: "http://10.10.10.211:3000"
        passHostHeader: true
